<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chequeo de Competencias</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container my-3">
    <!-- Selector de Competidor -->
    <div class="row mb-3">
      <div class="col-12">
        <select id="competidorSelect" class="form-select form-select-lg fw-bold text-primary">
          <option value="Mangocenter">Competidor: Mangocenter</option>
          <option value="Casapro">Competidor: Casapro</option>
        </select>
      </div>
    </div>

    <!-- Buscador -->
    <div class="row mb-3">
      <div class="col-12">
        <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="Buscar por código o descripción...">
      </div>
    </div>

    <!-- Botones de Filtro por Estado (Pendientes / Chequeados) -->
    <div class="row mb-3">
      <div class="col-12">
        <div class="btn-group w-100 shadow-sm" role="group">
          <button type="button" class="btn btn-primary active" id="btn-estado-todos" onclick="filtrarPorEstado('todos')">Todos</button>
          <button type="button" class="btn btn-outline-warning text-dark fw-semibold" id="btn-estado-pendientes" onclick="filtrarPorEstado('pendientes')">Pendientes</button>
          <button type="button" class="btn btn-outline-success fw-semibold" id="btn-estado-chequeados" onclick="filtrarPorEstado('chequeados')">Chequeados</button>
        </div>
      </div>
    </div>

    <!-- Filtros de Categoría -->
    <div class="row mb-3">
      <div class="col-12 d-flex flex-wrap gap-1" id="categoryContainer"></div>
    </div>

    <!-- Lista de Productos -->
    <div class="row" id="productsContainer">
      <div class="text-center my-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted">Cargando productos de la hoja...</p>
      </div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyUvqE_7IpalfOp5XXo2Jdh94ETQvD9B4aGOyLWnk8chf24vSL6rnMgBcv-JzasKuAF/exec";

    let todosLosProductos = [];
    let productosFiltrados = [];
    let categoriaActual = "Todas";
    let estadoFiltroActual = "todos"; // 'todos', 'pendientes', 'chequeados'

    document.addEventListener("DOMContentLoaded", () => {
      cargarDatos();
      document.getElementById("searchInput").addEventListener("input", aplicarFiltros);
    });

    async function cargarDatos() {
      try {
        const response = await fetch(APPS_SCRIPT_URL);
        if (!response.ok) throw new Error("Error en la respuesta del servidor");
        todosLosProductos = await response.json();
        
        generarBotonesCategorias();
        aplicarFiltros();
      } catch (error) {
        console.error("Error al cargar:", error);
        document.getElementById("productsContainer").innerHTML = `
          <div class="col-12 text-center text-danger my-5">
            <h5>Error al cargar los datos</h5>
            <p>${error.message}</p>
          </div>`;
      }
    }

    function filtrarPorEstado(estado) {
      estadoFiltroActual = estado;
      
      // Actualizar estilos visuales de los botones de estado
      document.getElementById("btn-estado-todos").className = `btn ${estado === 'todos' ? 'btn-primary' : 'btn-outline-primary'}`;
      document.getElementById("btn-estado-pendientes").className = `btn ${estado === 'pendientes' ? 'btn-warning text-dark fw-bold' : 'btn-outline-warning text-dark fw-semibold'}`;
      document.getElementById("btn-estado-chequeados").className = `btn ${estado === 'chequeados' ? 'btn-success fw-bold' : 'btn-outline-success fw-semibold'}`;

      aplicarFiltros();
    }

    function generarBotonesCategorias() {
      const categorias = ["Todas", ...new Set(todosLosProductos.map(p => p.categoria).filter(c => c))];
      const container = document.getElementById("categoryContainer");
      container.innerHTML = "";

      categorias.forEach(cat => {
        const btn = document.createElement("button");
        btn.className = `btn btn-sm ${cat === categoriaActual ? 'btn-dark' : 'btn-outline-secondary'}`;
        btn.textContent = cat;
        btn.onclick = () => {
          categoriaActual = cat;
          document.querySelectorAll("#categoryContainer button").forEach(b => b.className = 'btn btn-sm btn-outline-secondary');
          btn.className = 'btn btn-sm btn-dark';
          aplicarFiltros();
        };
        container.appendChild(btn);
      });
    }

    function aplicarFiltros() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();

      productosFiltrados = todosLosProductos.filter(prod => {
        const coincideCat = categoriaActual === "Todas" || String(prod.categoria) === String(categoriaActual);
        const coincideText = String(prod.codigo || "").toLowerCase().includes(query) || 
                             String(prod.descripcion || "").toLowerCase().includes(query);
        
        // Filtro por estado (todos, pendientes, chequeados)
        let coincideEstado = true;
        if (estadoFiltroActual === "pendientes") {
          coincideEstado = !prod.chequeado;
        } else if (estadoFiltroActual === "chequeados") {
          coincideEstado = prod.chequeado;
        }

        return coincideCat && coincideText && coincideEstado;
      });

      renderizarProductos();
    }

    function renderizarProductos() {
      const container = document.getElementById("productsContainer");
      container.innerHTML = "";

      if (productosFiltrados.length === 0) {
        container.innerHTML = `<div class="col-12 text-center text-muted my-4">No se encontraron artículos con los filtros seleccionados.</div>`;
        return;
      }

      productosFiltrados.forEach(prod => {
        const col = document.createElement("div");
        col.className = "col-12 mb-3";

        // Preparamos el HTML para la foto de referencia
        const imagenHtml = prod.referencia && String
