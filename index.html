<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chequeo de Competencias</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0d6efd">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container my-3">
    <!-- Indicador de Estado de Conexión -->
    <div id="connectionStatus" class="alert alert-warning py-1 px-3 d-none mb-2 text-center small fw-semibold" role="alert">
      Modo Offline - Los cambios se guardan en el teléfono (Usa el botón de sincronizar al conectar).
    </div>

    <!-- Selector de Competidor y Botón de Sincronización Manual Total -->
    <div class="row mb-3 align-items-center">
      <div class="col-6">
        <select id="competidorSelect" class="form-select form-select-lg fw-bold text-primary">
          <option value="Mangocenter">Competidor: Mangocenter</option>
          <option value="Casapro">Competidor: Casapro</option>
        </select>
      </div>
      <div class="col-6 text-end">
        <button class="btn btn-primary btn-sm w-100 fw-bold shadow-sm py-2" id="btnSincronizarManual" onclick="sincronizarDatosManualmente()">
          🚀 Sincronizar con Sheets <span id="pendingBadge" class="badge bg-danger ms-1 d-none">0</span>
        </button>
      </div>
    </div>

    <!-- Buscador -->
    <div class="row mb-3">
      <div class="col-12">
        <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="Buscar por código o descripción...">
      </div>
    </div>

    <!-- Botones de Filtro por Estado con Contadores en Vivo -->
    <div class="row mb-3">
      <div class="col-12">
        <div class="btn-group w-100 shadow-sm" role="group">
          <button type="button" class="btn btn-primary active" id="btn-estado-todos" onclick="filtrarPorEstado('todos')">
            Todos <span class="badge bg-light text-primary ms-1" id="count-todos">0</span>
          </button>
          <button type="button" class="btn btn-outline-warning text-dark fw-semibold" id="btn-estado-pendientes" onclick="filtrarPorEstado('pendientes')">
            Pendientes <span class="badge bg-warning text-dark ms-1" id="count-pendientes">0</span>
          </button>
          <button type="button" class="btn btn-outline-success fw-semibold" id="btn-estado-chequeados" onclick="filtrarPorEstado('chequeados')">
            Chequeados <span class="badge bg-success text-white ms-1" id="count-chequeados">0</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Filtros de Categoría -->
    <div class="row mb-3">
      <div class="col-12 d-flex flex-wrap gap-1" id="categoryContainer"></div>
    </div>

    <!-- Lista de Productos -->
    <div class="row" id="productsContainer">
      <div class="text-center my-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-2 text-muted">Cargando productos...</p>
      </div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyUvqE_7IpalfOp5XXo2Jdh94ETQvD9B4aGOyLWnk8chf24vSL6rnMgBcv-JzasKuAF/exec";

    let todosLosProductos = [];
    let productosFiltrados = [];
    let categoriaActual = "Todas";
    let estadoFiltroActual = "todos";

    document.addEventListener("DOMContentLoaded", () => {
      window.addEventListener('online', actualizarEstadoRed);
      window.addEventListener('offline', actualizarEstadoRed);
      actualizarEstadoRed();

      cargarDatos();
      document.getElementById("searchInput").addEventListener("input", aplicarFiltros);
      document.getElementById("competidorSelect").addEventListener("change", cargarDatos);
    });

    function actualizarEstadoRed() {
      const banner = document.getElementById("connectionStatus");
      if (navigator.onLine) {
        banner.classList.add("d-none");
      } else {
        banner.classList.remove("d-none");
      }
      actualizarBadgePendientes();
    }

    function obtenerClaveCache() {
      const competidor = document.getElementById("competidorSelect").value;
      return `cache_productos_${competidor}`;
    }

    function obtenerClavePendientes() {
      const competidor = document.getElementById("competidorSelect").value;
      return `pendientes_subida_${competidor}`;
    }

    async function cargarDatos() {
      const competidor = document.getElementById("competidorSelect").value;
      const cacheKey = obtenerClaveCache();

      // 1. Cargar memoria local primero (apertura instantánea garantizada)
      cargarDesdeCache(cacheKey);

      if (todosLosProductos.length > 0) {
        aplicarPendientesLocalesAData();
        generarBotonesCategorias();
        actualizarContadores();
        aplicarFiltros();
        actualizarBadgePendientes();
      } else {
        document.getElementById("productsContainer").innerHTML = `
          <div class="text-center my-5">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2 text-muted">Cargando productos...</p>
          </div>`;
      }

      // 2. Refrescar desde Sheets en segundo plano si hay internet
      if (navigator.onLine) {
        try {
          const response = await fetch(`${APPS_SCRIPT_URL}?competidor=${encodeURIComponent(competidor)}&_t=${Date.now()}`);
          if (response.ok) {
            const datosNuevos = await response.json();
            if (Array.isArray(datosNuevos) && datosNuevos.length > 0) {
              todosLosProductos = datosNuevos;
              localStorage.setItem(cacheKey, JSON.stringify(todosLosProductos));
              
              aplicarPendientesLocalesAData();
              generarBotonesCategorias();
              actualizarContadores();
              aplicarFiltros();
            }
          }
        } catch (error) {
          console.warn("Uso de datos locales por falta de conexión:", error);
        }
      }
    }

    function cargarDesdeCache(cacheKey) {
      const localData = localStorage.getItem(cacheKey);
      if (localData) {
        try {
          todosLosProductos = JSON.parse(localData);
        } catch (e) {
          todosLosProductos = [];
        }
      } else {
        todosLosProductos = [];
      }
    }

    function guardarChequeo(codigo) {
      const relacion = document.getElementById(`relacion_${codigo}`).value;
      const marca = document.getElementById(`marca_${codigo}`).value;
      const precio = document.getElementById(`precio_${codigo}`).value;
      const formaPago = document.getElementById(`pago_${codigo}`).value;
      const competidor = document.getElementById("competidorSelect").value;
      const btnGuardar = document.getElementById(`btn_guardar_${codigo}`);

      btnGuardar.disabled = true;
      btnGuardar.textContent = "Guardado Local";

      const objetoRegistro = {
        codigo: codigo,
        relacion: relacion,
        marca: marca,
        precio: precio,
        formaPago: formaPago,
        pago: formaPago,
        competidor: competidor,
        timestamp: Date.now()
      };

      // 1. Actualizar memoria del teléfono
      const productoLocal = todosLosProductos.find(p => p.codigo === codigo);
      if (productoLocal) {
        productoLocal.chequeado = (precio !== "" || marca.trim().toLowerCase() === "no aplica");
        productoLocal.relacion = relacion;
        productoLocal.marca = marca;
        productoLocal.precio = precio;
        productoLocal.formaPago = formaPago;
        productoLocal.pendienteSubida = true;
      }

      // 2. Guardar en caché local
      localStorage.setItem(obtenerClaveCache(), JSON.stringify(todosLosProductos));

      // 3. Añadir a cola de pendientes
      const pendientesKey = obtenerClavePendientes();
      let pendientes = JSON.parse(localStorage.getItem(pendientesKey) || "[]");
      pendientes = pendientes.filter(item => item.codigo !== codigo);
      pendientes.push(objetoRegistro);
      localStorage.setItem(pendientesKey, JSON.stringify(pendientes));

      actualizarContadores();
      actualizarBadgePendientes();
      aplicarFiltros();
      
      // Rehabilitar botón brevemente para permitir nuevas ediciones locales si lo desea
      setTimeout(() => {
        btnGuardar.disabled = false;
        btnGuardar.textContent = "Actualizar";
      }, 1000);
    }

    // BOTÓN DE SINCRONIZACIÓN MANUAL (El usuario decide cuándo sube)
    async function sincronizarDatosManualmente() {
      if (!navigator.onLine) {
        alert("⚠️ Estás sin conexión a internet. Conéctate a una red para poder sincronizar los datos con Google Sheets.");
        return;
      }

      const pendientesKey = obtenerClavePendientes();
      let pendientes = JSON.parse(localStorage.getItem(pendientesKey) || "[]");

      if (pendientes.length === 0) {
        alert("✔️ No hay cambios pendientes por subir. Todo está sincronizado.");
        return;
      }

      const btnSinc = document.getElementById("btnSincronizarManual");
      btnSinc.disabled = true;
      btnSinc.textContent = `⏳ Subiendo ${pendientes.length}...`;

      let subidosConExito = 0;

      for (let i = 0; i < pendientes.length; i++) {
        const item = pendientes[i];
        
        const formData = new FormData();
        formData.append("codigo", item.codigo || "");
        formData.append("relacion", item.relacion || "");
        formData.append("marca", item.marca || "");
        formData.append("precio", item.precio || "");
        formData.append("formaPago", item.formaPago || item.pago || "");
        formData.append("pago", item.formaPago || item.pago || "");
        formData.append("competidor", item.competidor || "");
        formData.append("timestamp", item.timestamp || Date.now());

        try {
          await fetch(APPS_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            body: formData
          });

          // Quitamos el ítem de la cola local de pendientes
          pendientes = pendientes.filter(p => p.codigo !== item.codigo);
          localStorage.setItem(pendientesKey, JSON.stringify(pendientes));

          const prod = todosLosProductos.find(p => p.codigo === item.codigo);
          if (prod) prod.pendienteSubida = false;
          subidosConExito++;

        } catch (e) {
          console.error("Error al subir pendiente:", item.codigo, e);
          break;
        }
      }

      localStorage.setItem(obtenerClaveCache(), JSON.stringify(todosLosProductos));
      actualizarBadgePendientes();
      aplicarFiltros();

      btnSinc.disabled = false;
      btnSinc.innerHTML = `🚀 Sincronizar con Sheets <span id="pendingBadge" class="badge bg-danger ms-1 d-none">0</span>`;
      actualizarBadgePendientes();

      alert(`✅ Sincronización finalizada. Se enviaron ${subidosConExito} registros al Google Sheets.`);
      
      // Recargar datos frescos del servidor
      cargarDatos();
    }

    function aplicarPendientesLocalesAData() {
      const pendientesKey = obtenerClavePendientes();
      const pendientes = JSON.parse(localStorage.getItem(pendientesKey) || "[]");

      pendientes.forEach(item => {
        const prod = todosLosProductos.find(p => p.codigo === item.codigo);
        if (prod) {
          prod.chequeado = (item.precio !== "" || item.marca.trim().toLowerCase() === "no aplica");
          prod.relacion = item.relacion;
          prod.marca = item.marca;
          prod.precio = item.precio;
          prod.formaPago = item.formaPago;
          prod.pendienteSubida = true;
        }
      });
    }

    function actualizarBadgePendientes() {
      const pendientesKey = obtenerClavePendientes();
      const pendientes = JSON.parse(localStorage.getItem(pendientesKey) || "[]");
      const badge = document.getElementById("pendingBadge");
      
      if (!badge) return;

      if (pendientes.length > 0) {
        badge.textContent = pendientes.length;
        badge.classList.remove("d-none");
      } else {
        badge.classList.add("d-none");
      }
    }

    function actualizarContadores() {
      const total = todosLosProductos.length;
      const chequeados = todosLosProductos.filter(p => p.chequeado).length;
      const pendientes = total - chequeados;

      document.getElementById("count-todos").textContent = total;
      document.getElementById("count-pendientes").textContent = pendientes;
      document.getElementById("count-chequeados").textContent = chequeados;
    }

    function filtrarPorEstado(estado) {
      estadoFiltroActual = estado;
      
      document.getElementById("btn-estado-todos").className = `btn ${estado === 'todos' ? 'btn-primary' : 'btn-outline-primary'}`;
      document.getElementById("btn-estado-pendientes").className = `btn ${estado === 'pendientes' ? 'btn-warning text-dark fw-bold' : 'btn-outline-warning text-dark fw-semibold'}`;
      document.getElementById("btn-estado-chequeados").className = `btn ${estado === 'chequeados' ? 'btn-success fw-bold' : 'btn-outline-success fw-semibold'}`;

      aplicarFiltros();
    }

    function generarBotonesCategorias() {
      const categorias = ["Todas", ...new Set(todosLosProductos.map(p => p.categoria).filter(c => c))];
      const container = document.getElementById("categoryContainer");
      container.innerHTML = "";

      categorias.forEach(cat => {
        const btn = document.createElement("button");
        btn.className = `btn btn-sm ${cat === categoriaActual ? 'btn-dark' : 'btn-outline-secondary'}`;
        btn.textContent = cat;
        btn.onclick = () => {
          categoriaActual = cat;
          document.querySelectorAll("#categoryContainer button").forEach(b => b.className = 'btn btn-sm btn-outline-secondary');
          btn.className = 'btn btn-sm btn-dark';
          aplicarFiltros();
        };
        container.appendChild(btn);
      });
    }

    function aplicarFiltros() {
      const query = document.getElementById("searchInput").value.toLowerCase().trim();

      productosFiltrados = todosLosProductos.filter(prod => {
        const catProd = prod.categoria || "";
        const codProd = prod.codigo || "";
        const descProd = prod.descripcion || "";

        const coincideCat = categoriaActual === "Todas" || String(catProd) === String(categoriaActual);
        const coincideText = String(codProd).toLowerCase().includes(query) || 
                             String(descProd).toLowerCase().includes(query);
        
        let coincideEstado = true;
        if (estadoFiltroActual === "pendientes") {
          coincideEstado = !prod.chequeado;
        } else if (estadoFiltroActual === "chequeados") {
          coincideEstado = prod.chequeado;
        }

        return coincideCat && coincideText && coincideEstado;
      });

      renderizarProductos();
    }

    function renderizarProductos() {
      const container = document.getElementById("productsContainer");
      
      const elementoActivo = document.activeElement;
      if (elementoActivo && (elementoActivo.tagName === 'INPUT' || elementoActivo.tagName === 'SELECT') && elementoActivo.id !== 'searchInput') {
        return; 
      }

      container.innerHTML = "";

      if (productosFiltrados.length === 0) {
        container.innerHTML = `<div class="col-12 text-center text-muted my-4">No se encontraron artículos con los filtros seleccionados.</div>`;
        return;
      }

      productosFiltrados.forEach(prod => {
        const numeroReal = todosLosProductos.findIndex(p => p.codigo === prod.codigo) + 1;

        const col = document.createElement("div");
        col.className = "col-12 mb-3";

        const codigoProd = String(prod.codigo || "").trim();
        const descProd = prod.descripcion || "Sin descripción";
        const catProd = prod.categoria || "General";
        
        const estadoClase = prod.chequeado ? "border-success bg-white" : "border-warning bg-white";
        const estadoTexto = prod.chequeado ? 'Chequeado' : 'Pendiente';
        const estadoBadgeClase = prod.chequeado ? 'bg-success' : 'bg-warning text-dark';

        const textoBoton = prod.chequeado ? (prod.pendienteSubida ? 'Guardado Local' : 'Actualizar') : 'Guardar';
        const claseBoton = prod.chequeado ? 'btn-outline-primary' : 'btn-success';
        
        const pagoSheet = String(prod.formaPago || "").trim();
        const avisoPendiente = prod.pendienteSubida ? `<span class="badge bg-danger ms-1">Offline</span>` : '';

        col.innerHTML = `
          <div class="card shadow-sm p-3 border-2 ${estadoClase}">
            <div class="row g-0 align-items-center">
              <div class="col-3 text-center p-2">
                <span class="badge bg-dark mb-1">Item #${numeroReal}</span>
                <img src="https://raw.githubusercontent.com/nahumteran0520-stack/Chequeo-de-Competencias/main/img./${codigoProd}.png" alt="Prod ${codigoProd}" class="img-fluid rounded border shadow-sm" style="max-height: 90px; object-fit: contain;" onerror="this.src='https://via.placeholder.com/80?text=Sin+Foto'">
              </div>
              
              <div class="col-9 ps-3">
                <div class="d-flex justify-content-between align-items-start mb-2">
                  <div>
                    <span class="badge bg-secondary mb-1">${catProd}</span>
                    <h6 class="fw-bold mb-1">#${numeroReal} - Cód: ${codigoProd}</h6>
                    <p class="text-muted small mb-2">${descProd}</p>
                  </div>
                  <div>
                    <span class="badge ${estadoBadgeClase}">${estadoTexto}</span>
                    ${avisoPendiente}
                  </div>
                </div>

                <div class="row g-2 align-items-center">
                  <div class="col-md-2">
                    <select class="form-select form-select-sm" id="relacion_${codigoProd}">
                      <option value="" ${!prod.relacion ? 'selected' : ''}>Relación...</option>
                      <option value="Igual" ${prod.relacion === 'Igual' ? 'selected' : ''}>Igual</option>
                      <option value="Similar" ${prod.relacion === 'Similar' ? 'selected' : ''}>Similar</option>
                    </select>
                  </div>
                  <div class="col-md-3">
                    <input type="text" class="form-control form-control-sm" id="marca_${codigoProd}" placeholder="Marca chequeada" value="${prod.marca || ''}">
                  </div>
                  <div class="col-md-2">
                    <input type="number" step="0.01" class="form-control form-control-sm" id="precio_${codigoProd}" placeholder="Precio" value="${prod.precio || ''}">
                  </div>
                  <div class="col-md-3">
                    <select class="form-select form-select-sm" id="pago_${codigoProd}">
                      <option value="Dolar bcv" ${pagoSheet === 'Dolar bcv' || pagoSheet === 'dolar bcv' ? 'selected' : ''}>Dolar bcv</option>
                      <option value="Euro bcv" ${pagoSheet === 'Euro bcv' || pagoSheet === 'euro bcv' ? 'selected' : ''}>Euro bcv</option>
                    </select>
                  </div>
                  <div class="col-md-2">
                    <button class="btn ${claseBoton} btn-sm w-100 fw-semibold" id="btn_guardar_${codigoProd}" onclick="guardarChequeo('${codigoProd}')">
                      ${textoBoton}
                    </button>
                  </div>
                </div>

              </div>
            </div>
          </div>
        `;
        container.appendChild(col);
      });
    }

    // REGISTRO DEL SERVICE WORKER
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(() => console.log("Service Worker registrado con éxito"))
        .catch(err => console.error("Error al registrar Service Worker:", err));
    }
  </script>
</body>
</html>
